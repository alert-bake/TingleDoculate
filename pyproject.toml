[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tingledoculate"
version = "0.1.0"
description = "A lightweight, incremental static documentation generator."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=3.0,<5",
    "nh3>=0.2,<1",
    "Pygments>=2.17,<3",
]

[project.optional-dependencies]
dev = []

[project.scripts]
tingledoculate = "tingledoculate.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
